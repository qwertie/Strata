<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;font-family:var(--font-sans);color:var(--foreground)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);padding:7px 12px;border-radius:var(--radius);cursor:pointer}button[aria-selected=true]{background:var(--primary);color:var(--primary-foreground)}
.legend{display:flex;gap:18px;color:var(--muted-foreground);font-size:13px;margin:8px 0}.key{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}.old{background:var(--chart-2)}.new{background:var(--primary)}
.prompt{font-weight:600;font-size:14px;margin:15px 0 5px}.row{display:grid;grid-template-columns:38px 1fr 53px;align-items:center;gap:8px;margin:5px 0;font-size:12px}.track{height:12px;background:var(--secondary);border-radius:3px}.bar{height:12px;border-radius:3px}.value{text-align:right;font-variant-numeric:tabular-nums}small{display:block;color:var(--muted-foreground);font-size:12px;margin-top:12px;line-height:1.5}
</style></head><body><div class="tabs" role="tablist" id="tabs"></div><div class="legend"><span><i class="key old"></i>Old engine</span><span><i class="key new"></i>New engine</span><span>Output tokens / second</span></div><div id="chart" aria-live="polite"></div><small id="summary"></small><small>Strix Halo / Windows HIP; all 24,576 experts on GPU. Two measured rounds of 256 tokens after warm-up. Fixed bar scale across modes.</small><script>
const data=[{"title": "No drafts", "values": [{"prompt": "Seasons", "old": 26.502818512632842, "new": 31.84535101413759}, {"prompt": "Repeat", "old": 25.831319465816385, "new": 31.087390784288722}, {"prompt": "Story", "old": 27.039302048015884, "new": 31.14904697300619}]}, {"title": "Suffix", "values": [{"prompt": "Seasons", "old": 24.009266076126256, "new": 31.483474250576478}, {"prompt": "Repeat", "old": 73.21083863587617, "new": 91.16971456044446}, {"prompt": "Story", "old": 23.563305674062413, "new": 31.00850311296301}]}, {"title": "MTP", "values": [{"prompt": "Seasons", "old": 44.34167337854105, "new": 51.13505847573581}, {"prompt": "Repeat", "old": 64.7347392909523, "new": 72.05787147803079}, {"prompt": "Story", "old": 36.4643795714011, "new": 42.36586899678946}]}, {"title": "MTP + suffix", "values": [{"prompt": "Seasons", "old": 40.28704519702883, "new": 48.33928133084084}, {"prompt": "Repeat", "old": 61.894054785909425, "new": 86.74584484014706}, {"prompt": "Story", "old": 34.47138269294212, "new": 40.81339827340194}]}];const max=Math.ceil(Math.max(...data.flatMap(d=>d.values.flatMap(v=>[v.old,v.new])))/20)*20;
function show(index){document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-selected',String(i===index)));const d=data[index];document.getElementById('chart').innerHTML=d.values.map(v=>'<div class="prompt">'+v.prompt+'</div>'+['old','new'].map(k=>'<div class="row"><span>'+k+'</span><div class="track"><div class="bar '+k+'" style="width:'+v[k]/max*100+'%"></div></div><span class="value">'+v[k].toFixed(2)+'</span></div>').join('')).join('');const gains=d.values.map(v=>(v.new/v.old-1)*100);document.getElementById('summary').textContent='New vs old: '+gains.map(g=>(g>=0?'+':'')+g.toFixed(1)+'%').join(' / ')+' (seasons / repeat / story). Scale: 0-'+max+' tok/s.'}
document.getElementById('tabs').innerHTML=data.map((d,i)=>'<button role="tab" aria-selected="false" onclick="show('+i+')">'+d.title+'</button>').join('');show(0);
</script></body></html>
